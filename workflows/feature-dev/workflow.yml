# Ralph loop (https://github.com/snarktank/ralph) — each agent runs in a fresh
# session with clean context. Memory persists via git history and progress files.
id: feature-dev
name: Feature Development Workflow
version: 6
description: |
  Story-based execution pipeline. Planner decomposes tasks into user stories.
  Setup prepares the environment and establishes baseline.
  Developer implements each story (with tests) in a fresh session. Verifier checks each story.
  Then integration/E2E testing, PR creation, and code review.

polling:
  model: nvidia/microsoft/phi-3-mini-4k-instruct
  timeoutSeconds: 240

agents:
  - id: planner
    name: Planner
    model: olGLM5
    pollingModel: nvPhi3Mini4k
    role: analysis
    description: Decomposes tasks into ordered user stories.
    workspace:
      baseDir: agents/planner
      files:
        AGENTS.md: agents/planner/AGENTS.md
        SOUL.md: agents/planner/SOUL.md
        IDENTITY.md: agents/planner/IDENTITY.md

  - id: setup
    name: Setup
    model: olQwen3CoderNext
    pollingModel: nvPhi3Mini4k
    role: coding
    description: Prepares environment, creates branch, establishes baseline.
    workspace:
      baseDir: agents/setup
      files:
        AGENTS.md: ../../agents/shared/setup/AGENTS.md
        SOUL.md: ../../agents/shared/setup/SOUL.md
        IDENTITY.md: ../../agents/shared/setup/IDENTITY.md

  - id: developer
    name: Developer
    model: olQwen3CoderNext
    pollingModel: nvPhi3Mini4k
    role: coding
    description: Implements features, writes tests, creates PRs.
    workspace:
      baseDir: agents/developer
      files:
        AGENTS.md: agents/developer/AGENTS.md
        SOUL.md: agents/developer/SOUL.md
        IDENTITY.md: agents/developer/IDENTITY.md

  - id: verifier
    name: Verifier
    model: olGLM5
    pollingModel: nvPhi3Mini4k
    role: verification
    description: Quick sanity check - did developer actually do the work?
    workspace:
      baseDir: agents/verifier
      skills:
        - agent-browser
      files:
        AGENTS.md: ../../agents/shared/verifier/AGENTS.md
        SOUL.md: ../../agents/shared/verifier/SOUL.md
        IDENTITY.md: ../../agents/shared/verifier/IDENTITY.md

  - id: tester
    name: Tester
    model: olGLM5
    pollingModel: nvPhi3Mini4k
    role: testing
    description: Integration and E2E testing after all stories are implemented.
    workspace:
      baseDir: agents/tester
      files:
        AGENTS.md: agents/tester/AGENTS.md
        SOUL.md: agents/tester/SOUL.md
        IDENTITY.md: agents/tester/IDENTITY.md

  - id: reviewer
    name: Reviewer
    model: olGLM5
    pollingModel: nvPhi3Mini4k
    role: analysis
    description: Reviews PRs, requests changes or approves.
    workspace:
      baseDir: agents/reviewer
      skills:
        - agent-browser
      files:
        AGENTS.md: agents/reviewer/AGENTS.md
        SOUL.md: agents/reviewer/SOUL.md
        IDENTITY.md: agents/reviewer/IDENTITY.md

steps:
  - id: plan
    agent: planner
    input: |
      Decompose the following task into ordered user stories for autonomous execution.

      TASK:
      {{task}}

      Instructions:
      1. Explore the codebase to understand the stack, conventions, and patterns
      2. Detect the project stack: Flutter (pubspec.yaml), Node.js (package.json), Python (pyproject.toml), etc.
      3. Break the task into small user stories (max 20)
      4. Order by dependency: schema/DB first, backend, frontend, integration
      5. Each story must fit in one developer session (one context window)
      6. Every acceptance criterion must be mechanically verifiable
      7. For Flutter projects: Include "flutter analyze passes" as a criterion
      8. For Node.js projects: Include "Typecheck passes" as a criterion
      9. Every story MUST include test criteria — "Tests for [feature] pass"
      10. The developer is expected to write tests as part of each story

      Reply with:
      STATUS: done
      REPO: /path/to/repo
      BRANCH: feature-branch-name
      STACK: flutter|node|python|rust|go
      STORIES_JSON: [ ... array of story objects ... ]
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: setup
    agent: setup
    input: |
      Prepare the development environment for this feature.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}

      Instructions:
      1. cd into the repo
      2. Create the feature branch (git checkout -b {{branch}})
      3. **Detect the project stack FIRST:**
         - Flutter/Dart: Look for `pubspec.yaml` and `lib/` directory
         - Node.js: Look for `package.json`
         - Python: Look for `pyproject.toml` or `setup.py` or `requirements.txt`
         - Rust: Look for `Cargo.toml`
         - Go: Look for `go.mod`
      4. **For Flutter projects:**
         - Read `pubspec.yaml` to understand dependencies and Flutter SDK version
         - Check for platform directories: `android/`, `ios/`, `web/`, `linux/`, `macos/`, `windows/`
         - Build: `flutter build <platform>` (use most appropriate: linux, web, macos, windows)
         - Test: `flutter test`
         - Analyze: `flutter analyze`
         - Ensure `.gitignore` includes Flutter-specific entries
      5. **For Node.js projects:**
         - Read `package.json` for build/test/lint scripts
         - Build: `npm run build` or `yarn build`
         - Test: `npm test` or `yarn test`
         - Typecheck: `npm run typecheck` if available
      6. **For other stacks:** Detect appropriate build/test commands
      7. Ensure `.gitignore` exists and is appropriate for the stack
      8. Run the build to establish baseline
      9. Run the tests to establish baseline
      10. Report what you found

      Reply with:
      STATUS: done
      STACK: flutter|node|python|rust|go|unknown
      BUILD_CMD: <build command>
      TEST_CMD: <test command>
      ANALYZE_CMD: <analyze command if available>
      CI_NOTES: <brief CI notes>
      BASELINE: <baseline status>
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: implement
    agent: developer
    type: loop
    loop:
      over: stories
      completion: all_done
      fresh_session: true
      verify_each: true
      verify_step: verify
    input: |
      Implement the following user story. You are working on ONE story in a fresh session.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      STACK: {{stack}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}
      ANALYZE_CMD: {{analyze_cmd}}

      CURRENT STORY:
      {{current_story}}

      COMPLETED STORIES:
      {{completed_stories}}

      STORIES REMAINING: {{stories_remaining}}

      VERIFY FEEDBACK (if retrying):
      {{verify_feedback}}

      PROGRESS LOG:
      {{progress}}

      Instructions:
      1. Read progress-{{run_id}}.txt — especially the Codebase Patterns section
      2. Pull latest on the branch
      3. Implement this story only
      4. Write tests for this story's functionality
      5. **For Flutter projects:**
         - Run `flutter analyze` before committing
         - Run `flutter test` to verify tests pass
         - Run `flutter build <platform>` if needed
      6. **For Node.js projects:**
         - Run typecheck if available
         - Run `npm run build`
         - Run `npm test`
      7. Commit: feat: {{current_story_id}} - {{current_story_title}}
      8. Append to progress-{{run_id}}.txt
      9. Update Codebase Patterns if you found reusable patterns

      Reply with:
      STATUS: done
      CHANGES: what you implemented
      TESTS: what tests you wrote
    expects: "STATUS: done"
    max_retries: 2
    on_fail:
      escalate_to: human

  - id: verify
    agent: verifier
    input: |
      Verify the developer's work on this story.

      TASK (overall):
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      STACK: {{stack}}
      CHANGES: {{changes}}
      TEST_CMD: {{test_cmd}}
      ANALYZE_CMD: {{analyze_cmd}}

      CURRENT STORY:
      {{current_story}}

      PROGRESS LOG:
      {{progress}}

      Check:
      1. Code exists (not just TODOs or placeholders)
      2. Each acceptance criterion for the story is met
      3. Tests were written for this story's functionality
      4. Tests pass (run {{test_cmd}})
      5. No obvious incomplete work
      6. **For Flutter projects:** Run `{{analyze_cmd}}` and confirm no errors
      7. **For Node.js projects:** Run typecheck if available

      ## Visual Verification (Frontend Changes)
      Has frontend changes: {{has_frontend_changes}}

      If {{has_frontend_changes}} is 'true', you MUST also perform visual verification:
      1. Use the agent-browser skill to visually inspect the changed UI
      2. **For Flutter web:** Run `flutter run -d web` and take screenshots
      3. **For Flutter desktop:** Run `flutter run -d linux` (or appropriate platform)
      4. **For Node.js/web:** Open the changed HTML file or start dev server
      5. Visually confirm the UI renders correctly
      6. A visual PASS means: the page renders without broken layout, missing elements, or overlapping content
      7. Include your visual findings in VERIFIED output

      If {{has_frontend_changes}} is 'false', skip visual verification entirely.

      Reply with:
      STATUS: done
      VERIFIED: What you confirmed

      Or if incomplete:
      STATUS: retry
      ISSUES:
      - What's missing or incomplete
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: test
    agent: tester
    input: |
      Integration and E2E testing of the implementation.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      STACK: {{stack}}
      CHANGES: {{changes}}
      BUILD_CMD: {{build_cmd}}
      TEST_CMD: {{test_cmd}}

      PROGRESS LOG:
      {{progress}}

      Your job (integration/E2E testing — unit tests were already written per-story):
      1. Run the full test suite ({{test_cmd}}) to confirm everything passes together
      2. Look for integration issues between stories
      3. **For Flutter projects:** Run `flutter analyze` to check for issues
      4. If this is a UI feature, use agent-browser to test it end-to-end
      5. Check cross-cutting concerns: error handling, edge cases across features
      6. Verify the overall feature works as a cohesive whole

      Reply with:
      STATUS: done
      RESULTS: What you tested and the outcomes

      Or if issues found:
      STATUS: retry
      FAILURES:
      - Specific test failures or bugs found
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 2
      on_exhausted:
        escalate_to: human

  - id: pr
    agent: developer
    input: |
      Create a pull request for your changes.

      TASK:
      {{task}}

      REPO: {{repo}}
      BRANCH: {{branch}}
      STACK: {{stack}}
      CHANGES: {{changes}}
      RESULTS: {{results}}

      PROGRESS LOG:
      {{progress}}

      Create a PR with:
      - Clear title summarizing the change
      - Description explaining what and why
      - Reference to what was tested

      Use: gh pr create

      Reply with:
      STATUS: done
      PR: URL to the pull request
    expects: "STATUS: done"
    on_fail:
      escalate_to: human

  - id: review
    agent: reviewer
    input: |
      Review the pull request.

      PR: {{pr}}
      TASK: {{task}}
      STACK: {{stack}}
      CHANGES: {{changes}}

      PROGRESS LOG:
      {{progress}}

      Review for:
      - Code quality and clarity
      - Potential bugs or issues
      - Test coverage
      - Follows project conventions

      Use: gh pr view, gh pr diff to read the PR.

      IMPORTANT: Post your review to the PR on GitHub using:
      - If approving: gh pr review <number> --approve --body "your review summary"
      - If requesting changes: gh pr review <number> --request-changes --body "your feedback"

      ## Visual Review (Frontend Changes)
      Has frontend changes: {{has_frontend_changes}}

      If {{has_frontend_changes}} is 'true', you MUST also perform a visual design review:
      1. Check out the branch: git checkout {{branch}}
      2. **For Flutter projects:** Run `flutter run -d web` or `flutter run -d linux`
      3. **For Node.js/web:** Start dev server and open in browser
      4. Use the agent-browser skill to visually inspect the changed page
      5. Evaluate visual polish and design quality
      6. This is a DESIGN review — the verify step already confirmed elements render. You are checking whether the result looks GOOD.
      7. Include your visual design assessment in the review output

      If {{has_frontend_changes}} is 'false', skip visual review entirely.

      If changes needed, add comments to the PR explaining what needs to change.

      Reply with:
      STATUS: done
      DECISION: approved

      Or if changes needed:
      STATUS: retry
      DECISION: changes_requested
      FEEDBACK:
      - What needs to change
    expects: "STATUS: done"
    on_fail:
      retry_step: implement
      max_retries: 3
      on_exhausted:
        escalate_to: human